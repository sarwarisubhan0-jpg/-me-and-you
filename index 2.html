<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Me &amp; You</title>
<style>
:root{--bg:#0e1116;--panel:#171c24;--line:#2a313c;--text:#e8e4da;--mute:#8d96a3;--gold:#d4af5a;--long:#2ecc71;--short:#ef4b4b;--none:#8d96a3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font:600 34px/1.1 Georgia,"Times New Roman",serif;margin:12px 0 4px;color:var(--gold)}
.sub{color:var(--mute);margin:0 0 20px}
.drop{display:block;border:1.5px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--mute);background:var(--panel);cursor:pointer}
.drop:focus-within{outline:2px solid var(--gold)}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.prev{position:relative;display:none}
.prev img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.x{position:absolute;top:8px;right:8px;background:#000a;color:#fff;border:0;border-radius:20px;padding:6px 12px;font-size:14px}
label.f{display:block;margin:18px 0 6px;font-size:14px;color:var(--mute)}
.tfs{display:flex;gap:6px;flex-wrap:wrap}
.tfs button{flex:1 0 auto;min-width:44px;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px}
.tfs button[aria-pressed=true]{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
input[type=text],textarea{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
textarea{min-height:70px;resize:vertical}
.go{width:100%;margin-top:22px;padding:15px;border-radius:10px;border:0;background:var(--gold);color:#1a1405;font:700 16px inherit;letter-spacing:.04em}
.go:disabled{opacity:.45}
.reset{width:100%;margin-top:10px;padding:13px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font:inherit}
.msg{display:none;margin-top:16px;padding:12px;border-radius:8px;background:#3a1b1b;border:1px solid #6b2a2a}
.load{display:none;margin-top:20px;text-align:center;color:var(--mute)}
.spin{width:28px;height:28px;margin:0 auto 8px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
#res{display:none;margin-top:24px}
.dec{border-radius:12px;padding:18px;border:2px solid var(--c);background:var(--panel)}
.dec b{display:block;font-size:30px;color:var(--c);letter-spacing:.03em}
.dec span{color:var(--mute);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px}.bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.sec{margin-top:18px}.sec h2{font-size:15px;margin:0 0 4px;color:var(--gold)}.sec p{margin:0;white-space:pre-wrap}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:8px}.plan div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}.plan small{display:block;color:var(--mute)}
.fine{margin-top:22px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Me &amp; You</h1>
<p class="sub">AI-Powered Gold Chart Analysis</p>

<label class="drop" id="drop">Tap to choose a chart screenshot<input type="file" id="file" accept="image/png,image/jpeg,image/webp"></label>
<div class="prev" id="prev"><img id="img" alt="Chart preview"><button class="x" id="rm" type="button">Remove</button></div>

<label class="f">Timeframe</label>
<div class="tfs" id="tfs"></div>

<label class="f" for="price">Current chart price (optional)</label>
<input type="text" id="price" inputmode="decimal" placeholder="e.g. 2650.40">

<label class="f" for="ctx">Additional context (optional)</label>
<textarea id="ctx" maxlength="500" placeholder="Anything the chart doesn't show"></textarea>

<button class="go" id="go" type="button" disabled>ANALYZE CHART</button>
<button class="reset" id="reset" type="button">RESET</button>

<div class="load" id="load" role="status"><div class="spin"></div>Analyzing chart…</div>
<div class="msg" id="msg" role="alert"></div>
<div id="res"></div>
<p class="fine">An estimate from the screenshot only, not financial advice or a guarantee. The confidence score shows how clearly the chart supports the setup, not the chance of profit.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const TFS=["M1","M5","M15","M30","H1","H4","D1"];
let tf="H1",b64=null,mime="image/jpeg";
const ERR={invalid_input:"The image or timeframe is invalid. Choose a PNG, JPEG or WebP screenshot.",too_large:"The image is too large. Try a smaller screenshot.",rate_limited:"The AI usage limit has been reached. Wait a minute and try again.",ai_unavailable:"The AI service is unavailable right now. Try again shortly.",bad_response:"The AI response couldn't be read. Try again.",not_configured:"The server has no API key configured.",server_error:"Something went wrong on the server. Try again."};

TFS.forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.setAttribute("aria-pressed",t===tf);b.onclick=()=>{tf=t;[...$("tfs").children].forEach(c=>c.setAttribute("aria-pressed",c===b))};$("tfs").appendChild(b)});

function err(m){$("msg").textContent=m;$("msg").style.display="block"}
function clearUI(){$("msg").style.display="none";$("res").style.display="none"}
function removeImg(){b64=null;$("file").value="";$("prev").style.display="none";$("drop").style.display="block";$("go").disabled=true}

$("file").onchange=e=>{
  clearUI();const f=e.target.files[0];if(!f)return;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type))return err("That file isn't a supported image. Use PNG, JPEG or WebP.");
  if(f.size>15e6)return err("The image is too large (over 15 MB).");
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{ // downscale so the request stays small
    const s=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const d=c.toDataURL("image/jpeg",.88);b64=d.split(",")[1];mime="image/jpeg";
    $("img").src=d;$("prev").style.display="block";$("drop").style.display="none";$("go").disabled=false;URL.revokeObjectURL(url)};
  im.onerror=()=>err("That image couldn't be opened.");im.src=url};
$("rm").onclick=()=>{removeImg();clearUI()};
$("reset").onclick=()=>{removeImg();clearUI();$("price").value="";$("ctx").value="";tf="H1";[...$("tfs").children].forEach(c=>c.setAttribute("aria-pressed",c.textContent==="H1"))};

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sec=(h,t)=>t?`<div class="sec"><h2>${h}</h2><p>${esc(t)}</p></div>`:"";

$("go").onclick=async()=>{
  clearUI();$("go").disabled=true;$("load").style.display="block";
  try{
    const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:b64,mimeType:mime,timeframe:tf,price:$("price").value,context:$("ctx").value})});
    const d=await r.json().catch(()=>({error:"server_error"}));
    if(!r.ok)throw new Error(ERR[d.error]||ERR.server_error);
    render(d)
  }catch(e){err(e.message==="Failed to fetch"?"Can't reach the server. Check your connection.":e.message)}
  $("load").style.display="none";$("go").disabled=!b64};

function render(d){
  const col={LONG:"var(--long)",SHORT:"var(--short)",NO_TRADE:"var(--none)"}[d.decision];
  const label=d.decision==="NO_TRADE"?"NO TRADE":d.decision,cf=Math.max(0,Math.min(100,+d.confidence||0));
  const L=d.levels||{},p=d.plan||{};
  const hasPlan=d.decision!=="NO_TRADE"&&(p.entry||p.stopLoss||p.tp1);
  let h=`<div class="dec" style="--c:${col}"><b>${label}</b><span>Chart clarity score: ${cf}/100</span><div class="bar"><i style="width:${cf}%"></i></div></div>`;
  if(d.chartReadable===false)h+=sec("Chart not readable","This doesn't look like an interpretable trading chart.");
  h+=sec("Instrument and timeframe",`${d.instrument||"Not identifiable"} · ${d.timeframe||tf}`);
  h+=sec("Market structure",d.marketStructure)+sec("Trend",d.trend);
  h+=sec("Support",(L.support||[]).join(", "))+sec("Resistance",(L.resistance||[]).join(", "));
  h+=sec("BOS / CHOCH / liquidity evidence",d.evidence)+sec("Main reason",d.reason)+sec("Risks and conflicting signals",d.risks);
  if(hasPlan){const c=(k,v)=>`<div><small>${k}</small>${esc(v||"n/a")}</div>`;
    h+=`<div class="sec"><h2>Potential trade plan (estimate)</h2><div class="plan">${c("Entry",p.entry)}${c("Stop loss",p.stopLoss)}${c("TP1",p.tp1)}${c("TP2",p.tp2)}${c("Risk-to-reward",p.riskReward)}</div></div>`}
  h+=sec("Price scale",d.scaleNote);
  $("res").innerHTML=h;$("res").style.display="block";$("res").scrollIntoView({behavior:"smooth"})}
</script>
</body>
</html>
